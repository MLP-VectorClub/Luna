# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on
# a non-bare `production` remote with receive.denyCurrentBranch=updateInstead).
# Same steps: composer install as www-data, artisan optimize, migrate,
# conditional npm install based on whether package-lock.json changed,
# artisan commit:clear (flushes a redis-backed cache) and
# l5-swagger:generate (regenerates OpenAPI docs) on every deploy. No
# service restart for the app itself (no SSR process); the queue worker (setup/luna-horizon.service)
# is restarted when its unit is installed. php-fpm is reloaded (gracefully) at the end, so
# every worker drops its cached file status (and opcache) instead of serving a
# stale view of the release for a while.
#
# Dropped, not ported: a conditional "rebuild assets if assets/ changed"
# branch that referenced an undefined $CMD_BUILD and an assets/ folder
# that doesn't exist in this repo — dead code in the original script,
# never actually fired. Flag to the user if a real frontend build step
# is supposed to exist here.
#
# storage/ and bootstrap/cache/ directories themselves were already
# group www-data and group-writable, but a pre-existing individual file
# (storage/logs/laravel.log, dating back to 2021, predating both the
# toolkit and this app's prior deploy setup) was still owned pwny:pwny
# and not writable by www-data — same class of bug as SledgeHammerTime
# (see git-deploy-toolkit's CLAUDE.md pitfalls), just on a file instead
# of a whole directory tree, so the earlier directory-level check missed
# it. Re-asserting this on every deploy so it can't silently regress.
#
# One addition beyond the old script: an artisan down/up maintenance-
# mode bracket around the build. The old non-bare-remote setup didn't
# have one, and composer install/artisan optimize/migrate running
# against a live, still-serving site is exactly what produced a handful
# of transient 500s the first time this app deployed through the
# toolkit (a request landing mid-rebuild saw a half-regenerated
# bootstrap/cache). `artisan up` always runs in deploy_restart even if
# a build step fails (see FAILED below), same idiom used in `when`'s and
# SledgeHammerTime's deploy.conf — set -e would otherwise abort the
# whole hook on a failed step and leave the site stuck down.

deploy_build() {
  sudo -u www-data php artisan down --retry=15 || true

  FAILED=0

  if [[ -d vendor/ ]]; then
    sudo chmod -R ug+rw vendor/
  fi
  # As the deploy user, which owns vendor/ (www-data can't write there). composer rewrites
  # vendor/composer/installed.php whenever the recorded VCS reference changes, e.g. when the
  # worktree's own .git was removed, and www-data failing on that failed every deploy.
  if composer install --optimize-autoloader --ignore-platform-reqs --no-dev; then
    echo "git-deploy: composer install OK"
  else
    FAILED=1
  fi

  if sudo -u www-data php artisan optimize; then
    echo "git-deploy: artisan optimize OK"
  else
    FAILED=1
  fi

  sudo chgrp -R www-data storage bootstrap/cache
  # Capital X: folders also get the execute bit the group needs to enter them (the data import once left some at 2760, which made their files invisible
  # to the web server, a plain ug+rw never fixed that)
  sudo chmod -R ug+rwX storage bootstrap/cache
  sudo find storage bootstrap/cache -type d -exec chmod g+s {} \;

  if sudo -u www-data php artisan migrate --force; then
    echo "git-deploy: artisan migrate OK"
  else
    FAILED=1
  fi

  local changed_files=""
  if [[ "$oldrev" != "0000000000000000000000000000000000000000" ]]; then
    changed_files=$(git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev")
  fi

  if [[ -z "$changed_files" ]] || grep -q "^package-lock\.json" <<< "$changed_files"; then
    # As the deploy user, not www-data: node_modules is owned by it (www-data only ever reads
    # svgo from there), and as www-data npm can't even replace its own .package-lock.json,
    # which failed every deploy that touched package-lock.json (or had no changed-file list).
    if npm install --omit=dev --no-save; then
      echo "git-deploy: npm install OK"
    else
      FAILED=1
    fi
  else
    echo "git-deploy: skipping npm install, lockfile not modified"
  fi

  if sudo -u www-data php artisan commit:clear; then
    echo "git-deploy: commit:clear OK"
  else
    FAILED=1
  fi

  if sudo -u www-data php artisan l5-swagger:generate; then
    echo "git-deploy: l5-swagger:generate OK"
  else
    FAILED=1
  fi
}

deploy_restart() {
  # Graceful reload of every active php-fpm version: all workers restart, which clears each
  # worker's PHP stat cache and opcache (the API can only reach the one worker answering it).
  # Before `up`, so no request is served from the old cache.
  local unit
  for unit in $(systemctl list-units --type=service --state=active --no-legend --plain 'php*-fpm.service' | awk '{print $1}'); do
    if sudo systemctl reload "$unit"; then
      echo "git-deploy: reloaded $unit"
    else
      FAILED=1
    fi
  done

  # The queue worker runs the old code until it is restarted; skipped until the unit has been installed (setup/luna-horizon.service)
  if systemctl cat luna-horizon.service >/dev/null 2>&1; then
    sudo systemctl restart luna-horizon.service || FAILED=1
  fi

  sudo -u www-data php artisan up

  if [[ "$FAILED" == "1" ]]; then
    echo "git-deploy: one or more build steps failed, see above" >&2
    return 1
  fi
}
