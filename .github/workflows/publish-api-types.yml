# Publishes @went.tf/mlp-vectorclub-api-types to npm whenever the committed OpenAPI document changes on main (or on demand).
#
# Authenticates with npm trusted publishing (OIDC), so there is no token in the repo's secrets. One-time setup on npmjs.com: package
# settings > Trusted Publisher > GitHub Actions, organization MLP-VectorClub, repository Luna, workflow filename publish-api-types.yml.
#
# The version is the one in packages/api-types/package.json with the patch number replaced by the run number, so every publish is
# unique and increasing. Bump major/minor in package.json when the API changes in a breaking way.
name: Publish API types

on:
  push:
    branches: ["main"]
    paths:
      - docs/openapi/api-docs.json
      - packages/api-types/**
      - .github/workflows/publish-api-types.yml
  workflow_dispatch:

concurrency:
  group: publish-api-types
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packages/api-types
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/api-types/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build types
        run: npm run build

      # The same input must give the same files, so a run that changes nothing publishes nothing (the version is the only thing that may differ)
      - name: Compare with the published package
        id: compare
        run: |
          name="$(node -p "require('./package.json').name")"
          if ! published="$(npm view "$name" version 2>/dev/null)" || [ -z "$published" ]; then
            echo "Nothing is published yet"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old="$RUNNER_TEMP/published"; new="$RUNNER_TEMP/new"
          mkdir -p "$old" "$new"
          npm pack "$name@$published" --silent --pack-destination "$old" > /dev/null
          npm pack --silent --pack-destination "$new" > /dev/null
          tar -xzf "$old"/*.tgz -C "$old"
          tar -xzf "$new"/*.tgz -C "$new"
          for dir in "$old" "$new"; do
            node -e "const f=process.argv[1]+'/package/package.json';const p=require(f);delete p.version;require('fs').writeFileSync(f,JSON.stringify(p,null,2))" "$dir"
          done
          if diff -r "$old/package" "$new/package"; then
            echo "Identical to $published, not publishing"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        if: steps.compare.outputs.changed == 'true'
        run: |
          base="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          npm version "$base.$GITHUB_RUN_NUMBER" --no-git-tag-version
          echo "Publishing $(node -p "require('./package.json').version")"

      - name: Publish
        if: steps.compare.outputs.changed == 'true'
        run: npm publish --access public
