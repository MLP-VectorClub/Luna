# Publishes @mlp-vectorclub/api-types to npm whenever the committed OpenAPI document changes on main (or on demand).
#
# Authenticates with npm trusted publishing (OIDC), so there is no token in the repo's secrets. One-time setup on npmjs.com: package
# settings > Trusted Publisher > GitHub Actions, organization MLP-VectorClub, repository Luna, workflow filename publish-api-types.yml.
#
# The version is the one in packages/api-types/package.json with the patch number replaced by the run number, so every publish is
# unique and increasing. Bump major/minor in package.json when the API changes in a breaking way.
name: Publish API types

on:
  push:
    branches: ["main"]
    paths:
      - docs/openapi/api-docs.json
      - packages/api-types/**
      - .github/workflows/publish-api-types.yml
  workflow_dispatch:

concurrency:
  group: publish-api-types
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packages/api-types
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/api-types/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build types
        run: npm run build

      - name: Set version
        run: |
          base="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          npm version "$base.$GITHUB_RUN_NUMBER" --no-git-tag-version
          echo "Publishing $(node -p "require('./package.json').version")"

      - name: Publish
        run: npm publish --access public
